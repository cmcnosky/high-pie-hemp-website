<body>
<a class="skip" href="#main">Skip to content</a>
<div data-chrome="header"></div>

<main id="main">

  <section class="page-head">
    <div class="page-head__glow"></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">›</span>
        <span data-crumb>Shop</span>
      </nav>
      <h1 data-title>Shop all products</h1>
      <p data-blurb>
        Explore the complete High Pie lineup by format, profile, or cannabinoid family.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="shop">

        <aside class="filters" id="filters" aria-label="Catalog filters">
          <div class="mobile-nav__head" style="display:none" data-filter-head>
            <strong>Filters</strong>
            <button class="icon-btn" data-close-filters aria-label="Close filters"></button>
          </div>
          <div data-filter-groups></div>
          <button class="btn btn--ghost btn--sm btn--block" data-clear>Clear all filters</button>
        </aside>

        <div>
          <div class="shop__bar">
            <span class="shop__count" data-count></span>
            <div class="flex gap-1 items-center">
              <button class="btn btn--ghost btn--sm filter-toggle" data-open-filters>Filters</button>
              <label class="visually-hidden" for="sort">Sort products</label>
              <select class="select" id="sort">
                <option value="featured">Featured</option>
                <option value="name">Alphabetical</option>
              </select>
            </div>
          </div>

          <div class="chips" data-chips></div>
          <div class="grid grid--auto" data-results aria-live="polite"></div>
        </div>

      </div>
    </div>
  </section>

</main>

<div data-chrome="footer"></div>
